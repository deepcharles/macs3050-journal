name: Article Summary
description: Reference and reading questions for an assigned article.
title: "[Article Summary]: "
labels: ["article-summary"]
body:
  - type: input
    id: students
    attributes:
      label: Students
      description: Names of the students, separated by commas.
      placeholder: "e.g. Jane Doe, John Smith"
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "Question 1: Reference"
      description: >
        Give a correctly formatted citation. Paste a BibTeX entry created
        with [zbib.org](https://zbib.org/).
      placeholder: Paste your BibTeX entry here.
      render: bibtex
    validations:
      required: true

  - type: textarea
    id: research-question
    attributes:
      label: "Question 2: Research question"
      description: What's the research question(s)? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: "Question 3: Data"
      description: >
        Describe the data, using the systematic approach seen in class:
        **who** (the cases), **what** (the variables), and **when**,
        **where**, and **how** it was collected.
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: "Question 4: Results"
      description: >
        List the most important results and conclusions. Does the data
        support the findings?
    validations:
      required: true

  - type: textarea
    id: cited-articles
    attributes:
      label: "Question 5: Cited articles"
      description: >
        What are the three cited articles that you should read to better
        understand? Give a BibTeX entry for each (using
        [zbib.org](https://zbib.org/)). How many citations does each have
        (use [Google Scholar](https://scholar.google.com/))?
    validations:
      required: true

  - type: textarea
    id: questions-for-authors
    attributes:
      label: "Question 6: Questions for the authors"
      description: >
        What are three questions you wish you could ask the authors to
        help you better understand the article?
    validations:
      required: true
