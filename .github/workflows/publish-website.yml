name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "summaries/**"
      - "_quarto.yml"
      - "_brand.yml"
      - "custom.scss"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
